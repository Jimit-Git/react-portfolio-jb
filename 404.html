<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    var path = window.location.hash.replace('#', '');
    if (path) {
      window.location.href = '/react-portfolio-jb/' + path;
    } else {
      window.location.href = '/react-portfolio-jb/';
    }
  </script>
</head>
<body></body>
</html>
